# Rust build optimization configuration

# NOTE: To use sccache (Rust compiler cache), install it first:
#   cargo install sccache
#   Then set environment variable: RUSTC_WRAPPER=sccache
# Do NOT set rustc-wrapper here as it will fail if sccache is not installed

# Build optimizations
[build]
# Use all available CPU cores
jobs = -1

# Incremental compilation (enabled by default in dev profile)
incremental = true

# Rustflags for faster builds.
#
# `-C target-cpu=native` is only sound when the target IS the host: on an Apple
# Silicon host cross-compiling to Windows it resolves to `apple-m3`, and
# rustc-LLVM then rejects every crate with "64-bit code requested on a subtarget
# that doesn't support it" — which is why
# `cargo build --release --target x86_64-pc-windows-gnu` (the macOS → Windows
# cross-compile job in `.github/workflows/dev.yml`) could never build. The flag
# is therefore kept out of Windows targets, which are the only ones this project
# cross-compiles to.
[target.'cfg(all(debug_assertions, not(target_os = "windows")))']
rustflags = ["-C", "target-cpu=native"]

# Profile-specific optimizations
[profile.dev]
opt-level = 0          # No optimization for dev builds (fastest compile)
debug = true           # Full debug info
debug-assertions = true
overflow-checks = true
lto = false            # No LTO for dev builds
codegen-units = 256    # Max parallelism for dev builds

[profile.release]
opt-level = 3          # Maximum optimization
debug = false          # No debug info
debug-assertions = false
overflow-checks = false
lto = "thin"           # Thin LTO for faster build than full LTO
codegen-units = 16     # Some parallelism, better optimization
strip = true           # Strip symbols for smaller binary

[profile.test]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256

# Faster check builds (for linting)
[profile.check]
inherits = "dev"
opt-level = 0