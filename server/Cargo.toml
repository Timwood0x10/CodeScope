[package]
name = "codescope"
version = "0.2.7"
edition = "2024"

[[bin]]
name = "codescope"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
once_cell = "1"
libc = "0.2"

# Windows-only: the shared-file mapping in src/scheduler/mapped_file.rs needs
# CreateFileMappingW / MapViewOfFile, which the `libc` crate does not expose on
# Windows. `walkdir` already pulls windows-sys in as a transitive dependency, so
# this adds no new crate to the lockfile — only the Win32 features we call.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",       # CreateFileMappingW takes a *const SECURITY_ATTRIBUTES
    "Win32_System_Memory",
] }

[dev-dependencies]
proptest = "1.11.0"
