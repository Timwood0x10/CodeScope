# Reusable: lint (clang-format + cargo clippy + cargo fmt)
name: Lint

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build libsqlite3-dev libtree-sitter-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lint-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-cargo-registry-

      - name: Lint Rust (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Lint C++ (clang-format)
        run: |
          set -e
          FILES=$(find engine/src -name '*.cpp' -o -name '*.h')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror
            echo "  ✓ clang-format passed"
          fi
