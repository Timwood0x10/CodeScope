# Reusable: lint (clang-format + cargo clippy + cargo fmt)
name: Lint

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Lint Rust (clippy)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Lint C++ (clang-format)
        run: |
          FILES=$(find engine/src -name '*.cpp' -o -name '*.h' | head -100)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror 2>&1 | tail -10
            echo "  ✓ clang-format passed"
          fi
