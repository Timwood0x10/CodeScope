# Reusable: lint (clang-format + cargo clippy + cargo fmt)
name: Lint

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev \
            nodejs npm git gcc g++ libtree-sitter-dev clang-format

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install tree-sitter CLI + grammars
        run: |
          npm install -g tree-sitter-cli
          npm install -g tree-sitter-python tree-sitter-c tree-sitter-cpp \
            tree-sitter-rust tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-go tree-sitter-java tree-sitter-swift

      - name: Capture npm root for cmake
        shell: bash
        run: |
          NPM_ROOT=$(npm root -g)
          echo "TREE_SITTER_NPM=$NPM_ROOT" >> "$GITHUB_ENV"

      - name: Build grammar .so files
        run: |
          cd grammars
          bash clone_grammars.sh
          bash build_ci.sh

      - name: Build C++ engine
        run: |
          cmake -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release engine/
          cmake --build engine/build --target astgraph_engine

      - name: Lint Rust (clippy)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Lint C++ (clang-format)
        run: |
          FILES=$(find engine/src -name '*.cpp' -o -name '*.h' | head -100)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror 2>&1 | tail -10
            echo "  ✓ clang-format passed"
          fi

      - name: Run tests
        env:
          CBM_SKIP_PERF: '1'
        run: |
          cargo test --release
