# Reusable: lint (clang-format + cargo clippy + cargo fmt)
name: Lint

# SECURITY TODO (before public release): pin every `uses:` action to a specific
# commit SHA instead of a floating tag (e.g. @v4) to guard against tag
# re-pointing / supply-chain attacks. See:
#   https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Cargo.lock is not yet committed; include Cargo.toml so the key
          # still changes when dependencies change. Harmless once committed.
          key: lint-cargo-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: lint-cargo-registry-

      - name: Lint Rust (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Lint C++ (clang-format)
        run: |
          set -e
          FILES=$(find engine/src -name '*.cpp' -o -name '*.h')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs clang-format --dry-run --Werror
            echo "  ✓ clang-format passed"
          fi
