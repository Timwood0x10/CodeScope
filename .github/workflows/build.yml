# Push to master: lint → CI (build + test + package) → auto release draft
name: Build & Test

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  ci:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_ci.yml
    with:
      skip_perf: true
      skip_package: false

  # ── Auto create draft release ──
  release-draft:
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Read version from RELEASE.md
        id: version
        run: |
          VERSION=$(head -1 RELEASE.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Delete existing release + tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        continue-on-error: true
        run: |
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          echo "Cleaned up old release/tag for $VERSION"

      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > ../checksums.txt
          ls -la ../checksums.txt

      - name: List artifacts
        run: |
          echo "Artifacts to release:"
          find artifacts -type f | sort
          find . -name 'checksums.txt' -type f

      - name: Write release notes to file
        run: |
          tail -n +2 RELEASE.md > /tmp/release_body.md
          echo "Release body written ($(wc -c < /tmp/release_body.md) bytes)"
          head -5 /tmp/release_body.md

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION" --force

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la artifacts/*.tar.gz checksums.txt
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file /tmp/release_body.md \
            artifacts/*.tar.gz \
            checksums.txt
          echo "✅ Release $VERSION created with binaries"
