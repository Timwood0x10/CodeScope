# Push to master: lint → CI (build + test + package) → auto release draft
name: Build & Test

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  ci:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_ci.yml
    with:
      skip_perf: true
      skip_package: false

  # ── Auto create draft release ──
  release-draft:
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Read version from RELEASE.md
        id: version
        run: |
          VERSION=$(head -1 RELEASE.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate combined checksums
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          cd artifacts
          sha256sum *.tar.gz > ../checksums.txt
          ls -la ../checksums.txt

      - name: List artifacts
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          echo "Artifacts to release:"
          find artifacts -type f | sort
          find . -name 'checksums.txt' -type f

      - name: Write release notes to file
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          # Skip title line (# CodeScope v0.1.0), use rest as body
          tail -n +2 RELEASE.md > /tmp/release_body.md
          echo "Release body written ($(wc -c < /tmp/release_body.md) bytes)"
          head -3 /tmp/release_body.md

      - name: Create tag
        if: steps.check_tag.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create Draft Release
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file /tmp/release_body.md \
            artifacts/*.tar.gz \
            checksums.txt
