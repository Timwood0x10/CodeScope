# PR Validation: lint + test + light smoke (on product changes)
name: PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true

  # ── Single required status check ──
  ci-ok:
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All PR stages must succeed or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v['result'] for k, v in needs.items() if v['result'] not in ('success', 'skipped')}
          if bad:
              print('CI NOT OK:', bad)
              sys.exit(1)
          print('CI OK:', ', '.join(needs))
          "
