# Reusable: unit + integration tests on all platforms
name: Test

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4dd2b516f881d4534a0e4b16a3faa840 # v2.7.8
        with:
          sharedKey: codescope-${{ runner.os }}

      - name: Cache npm
        uses: actions/cache@5a3b84e0eb1b7366e4fc2890e0e72a2243f07d75 # v4.2.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('grammars/build_ci.sh', 'grammars/clone_grammars.sh') }}

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev nodejs npm git gcc g++ libtree-sitter-dev

      - name: Install deps (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake ninja sqlite node git tree-sitter

      - name: Install deps (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          choco install -y cmake ninja nodejs git mingw curl 2>$null | Out-Null

      - name: Install tree-sitter CLI + grammar npm packages
        shell: bash
        run: |
          npm install -g tree-sitter-cli
          npm install -g tree-sitter-python tree-sitter-c tree-sitter-cpp \
            tree-sitter-rust tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-go tree-sitter-java tree-sitter-swift

      - name: Capture npm root for cmake
        shell: bash
        run: |
          NPM_ROOT=$(npm root -g)
          echo "TREE_SITTER_NPM=$NPM_ROOT" >> "$GITHUB_ENV"
          echo "npm root: $NPM_ROOT"

      - name: Cache grammar binaries
        id: grammar-cache
        uses: actions/cache@5a3b84e0eb1b7366e4fc2890e0e72a2243f07d75 # v4.2.2
        with:
          path: |
            grammars/tree-sitter-*.so
            grammars/tree-sitter-*.dll
          key: grammars-${{ runner.os }}-${{ hashFiles('grammars/build_ci.sh', 'grammars/clone_grammars.sh') }}
          restore-keys: |
            grammars-${{ runner.os }}-

      - name: Build grammar .so files (runtime dlopen)
        if: steps.grammar-cache.outputs.cache-hit != 'true'
        run: |
          cd grammars
          bash clone_grammars.sh
          bash build_ci.sh

      - name: Build C++ engine
        shell: bash
        run: |
          cmake -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            engine/
          cmake --build engine/build --target astgraph_engine

      - name: Build Rust server
        shell: bash
        run: |
          cargo build --release --bin codescope

      - name: Run tests
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          cargo test --release
