name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev nodejs npm git
          npm install -g tree-sitter-cli

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build grammars
        run: |
          cd grammars
          bash build_ci.sh

      - name: Build C++ engine
        run: |
          cmake -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            engine/
          cmake --build engine/build --target astgraph_engine

      - name: Build Rust server
        run: |
          cargo build --release --bin codescope

      - name: Run all tests
        run: |
          cargo test --release
          make check

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true