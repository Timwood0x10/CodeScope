# Release pipeline: test → build → smoke → draft release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.6)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (auto-generated if empty)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — build + smoke only, no release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint]
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: false

  build:
    needs: [test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}

  smoke:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/_smoke.yml

  # ── Create DRAFT release ──
  release-draft:
    if: ${{ inputs.dry_run != true }}
    needs: [smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: |
          echo "Artifacts to release:"
          find artifacts -type f -name '*.tar.gz' | sort

      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > ../checksums.txt
          cd ..

      - name: Delete existing release (if re-running)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -f "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION" --force 2>/dev/null || true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          files: |
            artifacts/*.tar.gz
            checksums.txt
          body: ${{ inputs.release_notes || '' }}
          generate_release_notes: ${{ inputs.release_notes == '' }}

  # ── Dry run summary ──
  dry-run-summary:
    if: ${{ inputs.dry_run == true }}
    needs: [smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dry run complete
        run: |
          echo "========================================"
          echo "  Dry Run Complete — no release created"
          echo "  Version: ${{ inputs.version }}"
          echo "  To publish, re-run without dry_run"
          echo "========================================"
