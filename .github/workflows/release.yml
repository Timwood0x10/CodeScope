name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: codescope
            artifact: codescope-x86_64-linux
            ext: .so
          - os: macos-14
            target: aarch64-apple-darwin
            binary: codescope
            artifact: codescope-aarch64-macos
            ext: .so
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: codescope.exe
            artifact: codescope-x86_64-windows
            ext: .dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev nodejs npm git curl libtree-sitter-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake ninja sqlite node git curl tree-sitter

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          choco install -y cmake ninja nodejs git mingw curl 2>$null | Out-Null

      - name: Download tree-sitter grammars
        run: |
          cd grammars
          bash download_grammars_v2.sh || bash build_ci.sh

      - name: Build C++ engine
        run: |
          cmake -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            engine/
          cmake --build engine/build --target astgraph_engine

      - name: Build Rust server
        run: |
          cargo build --release --target ${{ matrix.target }} --bin codescope

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz \
            ${{ matrix.binary }} \
            ../../grammars/*${{ matrix.ext }}
          cd ../../..

      - name: Generate checksum
        run: |
          sha256sum ${{ matrix.artifact }}.tar.gz > checksum-${{ matrix.artifact }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for f in */; do
            cd "$f"
            sha256sum *.tar.gz >> ../../checksums.txt
            cd ..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CodeScope ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            artifacts/**/*.tar.gz
            checksums.txt
          draft: true
          prerelease: false
          generate_release_notes: true