# Windows-only CI — manual trigger only.
# Mirrors the Windows leg of the full CI pipeline for faster iteration.
name: Windows CI

on:
  workflow_dispatch:
    inputs:
      skip_grammars:
        description: 'Skip grammar build'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip cargo test'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        shell: pwsh
        run: |
          choco install -y cmake ninja nodejs git mingw curl 2>$null | Out-Null

      - name: Install tree-sitter CLI + grammar npm packages
        shell: bash
        run: |
          npm install -g tree-sitter-cli
          npm install -g tree-sitter-python tree-sitter-c tree-sitter-cpp \
            tree-sitter-rust tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-go tree-sitter-java tree-sitter-swift

      - name: Capture npm root for cmake
        shell: bash
        run: |
          NPM_ROOT=$(npm root -g)
          echo "TREE_SITTER_NPM=$NPM_ROOT" >> "$GITHUB_ENV"
          echo "npm root: $NPM_ROOT"

      - name: Build grammar .so files
        if: ${{ inputs.skip_grammars != true }}
        run: |
          cd grammars
          bash clone_grammars.sh
          bash build_ci.sh

      - name: Build C++ engine
        shell: bash
        run: |
          cmake -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            engine/
          cmake --build engine/build --target astgraph_engine

      - name: Build Rust server
        shell: bash
        run: |
          cargo build --release --bin codescope

      - name: Run tests
        if: ${{ inputs.skip_tests != true }}
        shell: bash
        run: |
          cargo test --release
