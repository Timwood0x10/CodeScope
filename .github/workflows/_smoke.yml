# Reusable: smoke test binaries
name: Smoke

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: codescope-x86_64-linux
          - os: macos-15
            artifact: codescope-aarch64-macos
          - os: windows-2022
            artifact: codescope-x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Extract binary
        shell: bash
        run: |
          tar -xzf "${{ matrix.artifact }}.tar.gz"
          chmod +x codescope codescope.exe 2>/dev/null || true
          ls -la

      - name: Verify binary exists and is executable
        shell: bash
        run: |
          BIN="./codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          file "$BIN"
          ls -lh "$BIN"

      - name: Quick smoke (binary starts without crash)
        shell: bash
        run: |
          BIN="./codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          # Run for 3s then kill — confirms binary loads + init doesn't segfault
          timeout 3 "$BIN" 2>&1 && echo "  (normal exit)" || echo "  (timeout/expected)"
          echo "✓ binary smoke passed"

      - name: Verify grammars are bundled
        shell: bash
        run: |
          echo "Checking grammars:"
          ls -la tree-sitter-*.so tree-sitter-*.dll 2>/dev/null || echo "  (no grammars found in package)"
