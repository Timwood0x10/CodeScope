# Manual: test the full pipeline before a release
name: Dry Run

on:
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip lint'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      skip_builds:
        description: 'Skip build + smoke'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.skip_lint != true }}
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint]
    if: ${{ inputs.skip_tests != true && !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true

  build:
    if: ${{ inputs.skip_builds != true && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [test]
    uses: ./.github/workflows/_build.yml

  smoke:
    if: ${{ inputs.skip_builds != true && !cancelled() && needs.build.result == 'success' }}
    needs: [build]
    uses: ./.github/workflows/_smoke.yml

  summary:
    if: ${{ always() }}
    needs: [lint, test, build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print pipeline results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          for name, info in needs.items():
              status = info['result']
              icon = '✅' if status == 'success' else '⏭️' if status == 'skipped' else '❌' if status == 'failure' else '⚠️'
              print(f'{icon} {name}: {status}')
          "
