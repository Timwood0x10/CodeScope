# Reusable: build → test → package (macOS + Linux only)
name: CI

# SECURITY TODO (before public release): pin every `uses:` action to a specific
# commit SHA instead of a floating tag (e.g. @v4) to guard against tag
# re-pointing / supply-chain attacks. See:
#   https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true
      skip_package:
        description: 'Skip packaging (PR mode)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: codescope-x86_64-linux
          - os: macos-15
            artifact: codescope-aarch64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git gcc g++ pkg-config libssl-dev
          # Install LadybugDB (graph storage engine)
          curl -fsSL https://install.ladybugdb.com | sh
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/ladybug.conf
          sudo ldconfig

      - name: Install deps (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install cmake ninja git ladybug

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Cargo.lock is the precise cache key, but it is not yet committed
          # to the repo; include Cargo.toml so the key still changes when
          # dependencies change. Once Cargo.lock is committed this stays correct.
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.os }}-cargo-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-target-

      - name: Cache CMake build + deps
        uses: actions/cache@v4
        with:
          path: |
            engine/build
          key: ${{ matrix.os }}-cmake-${{ hashFiles('engine/CMakeLists.txt', 'engine/cmake/deps_versions.cmake') }}
          restore-keys: ${{ matrix.os }}-cmake-

      - name: Build + test
        shell: bash
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          cargo build --release --bin codescope
          cargo nextest run --release --no-tests=pass

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/codescope --help || true
          # Verify binary is not corrupted (prints Mach-O / ELF metadata).
          file target/release/codescope

      - name: Build + test C++ engine
        shell: bash
        run: |
          # Configure with tests enabled in a separate build dir so the
          # release build (engine/build, BUILD_TESTS=OFF) stays untouched.
          cmake -S engine -B engine/build-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build engine/build-tests -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

          # Run every C++ test binary produced under the build dir.
          # nullglob: unmatched globs expand to nothing instead of a literal.
          shopt -s nullglob
          failed=0
          for test_bin in engine/build-tests/test_*; do
            # Only run regular executable files (skip dirs / non-binaries).
            [ -f "$test_bin" ] && [ -x "$test_bin" ] || continue
            test_name=$(basename "$test_bin")
            # Skip known manual/debug tools that need external args.
            case "$test_name" in
              test_bench|test_bench_enhance|test_bench_project|test_pipeline_bench|test_fast_scan_debug|test_verify_aiscope|test_bun)
                echo "  SKIP $test_name (requires external args)"
                continue
                ;;
            esac
            echo "  Running $test_name..."
            if "$test_bin" > /tmp/test_output.log 2>&1; then
              echo "  ✓ $test_name passed"
            else
              echo "  ✗ $test_name failed"
              cat /tmp/test_output.log
              failed=1
            fi
          done
          exit $failed

      - name: Strip binary
        if: inputs.skip_package != true
        shell: bash
        run: |
          strip target/release/codescope 2>/dev/null || true

      - name: Ad-hoc sign macOS binary
        if: ${{ matrix.os == 'macos-15' && inputs.skip_package != true }}
        run: codesign --sign - --force target/release/codescope 2>/dev/null || true

      - name: Package
        if: inputs.skip_package != true
        shell: bash
        run: |
          mkdir -p package
          cp target/release/codescope package/
          cp LICENSE package/
          [ -f install.sh ] && cp install.sh package/

          cd package
          tar -czf "../${{ matrix.artifact }}.tar.gz" ./*
          cd ..
          echo "Packaged: ${{ matrix.artifact }}.tar.gz ($(ls -lh ${{ matrix.artifact }}.tar.gz | awk '{print $5}'))"

      - name: Generate checksum
        if: inputs.skip_package != true
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "checksum-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v4
        if: inputs.skip_package != true
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt
