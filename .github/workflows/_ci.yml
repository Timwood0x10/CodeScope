# Reusable: build → test → package (single pass, no duplication)
name: CI

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true
      skip_package:
        description: 'Skip packaging (PR mode)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ext: .so
            artifact: codescope-x86_64-linux
          - os: macos-15
            ext: .so
            artifact: codescope-aarch64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev nodejs npm git gcc g++ libtree-sitter-dev

      - name: Install deps (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install cmake ninja sqlite node git tree-sitter

      - name: Install tree-sitter CLI + grammar npm packages
        shell: bash
        run: |
          npm install -g tree-sitter-cli
          npm install -g tree-sitter-python tree-sitter-c tree-sitter-cpp \
            tree-sitter-rust tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-go tree-sitter-java tree-sitter-swift

      - name: Capture npm root for cmake
        shell: bash
        run: |
          NPM_ROOT=$(npm root -g)
          echo "TREE_SITTER_NPM=$NPM_ROOT" >> "$GITHUB_ENV"
          echo "npm root: $NPM_ROOT"

      - name: Build grammar .so files (runtime dlopen)
        run: |
          cd grammars
          bash clone_grammars.sh
          bash build_ci.sh

      - name: Build C++ engine
        shell: bash
        run: |
          cmake -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            engine/
          cmake --build engine/build --target astgraph_engine

      - name: Build + test Rust server
        shell: bash
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          cargo build --release --bin codescope
          cargo test --release

      - name: Strip binary
        if: inputs.skip_package != true
        shell: bash
        run: |
          BIN="target/release/codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          strip "$BIN" 2>/dev/null || true

      - name: Ad-hoc sign macOS binary
        if: ${{ matrix.os == 'macos-15' && inputs.skip_package != true }}
        run: codesign --sign - --force target/release/codescope 2>/dev/null || true

      - name: Package
        if: inputs.skip_package != true
        shell: bash
        run: |
          BIN="target/release/codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"

          mkdir -p package
          cp "$BIN" package/
          cp LICENSE package/
          [ -f install.sh ] && cp install.sh package/
          [ -f install.ps1 ] && cp install.ps1 package/

          # Copy grammar files
          shopt -s nullglob
          for f in grammars/tree-sitter-*.so grammars/tree-sitter-*.dll; do
            cp "$f" package/
          done

          cd package
          tar -czf "../${{ matrix.artifact }}.tar.gz" ./*
          cd ..
          echo "Packaged: ${{ matrix.artifact }}.tar.gz ($(ls -lh ${{ matrix.artifact }}.tar.gz | awk '{print $5}'))"

      - name: Generate checksum
        if: inputs.skip_package != true
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "checksum-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v4
        if: inputs.skip_package != true
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt
