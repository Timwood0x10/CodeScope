# Reusable: build → test → package (macOS + Linux only)
name: CI

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true
      skip_package:
        description: 'Skip packaging (PR mode)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: codescope-x86_64-linux
          - os: ubuntu-24.04-arm
            artifact: codescope-aarch64-linux
          - os: macos-15
            artifact: codescope-aarch64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # ccache accelerates C/C++ compiles. On a dep-version cache miss
    # (full recompile of ~377 TUs) this turns a multi-minute rebuild
    # into mostly cache hits. CMakeLists already wires ccache as the
    # compiler launcher when it is on PATH.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e1397a0b7c06e2c0d9fbe862c4d8a4c3c1ef1d05 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a416626d420eb6777063d64a4348c7160cc5a3d3 # nextest

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git gcc g++ pkg-config libssl-dev ccache
          # Install LadybugDB (graph storage engine)
          curl -fsSL https://install.ladybugdb.com | sh
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/ladybug.conf
          sudo ldconfig

      - name: Install deps (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install cmake ninja git ladybug ccache

      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545934eab1c4a9ef4d8fc6e8535 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Cargo.lock is committed — use it as the precise cache key
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@5a3ec84eff668545934eab1c4a9ef4d8fc6e8535 # v4.2.3
        with:
          path: target
          key: ${{ matrix.os }}-cargo-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-target-

      - name: Cache ccache
        uses: actions/cache@5a3ec84eff668545934eab1c4a9ef4d8fc6e8535 # v4.2.3
        with:
          path: ${{ github.workspace }}/.ccache
          # Same key family as the CMake cache: a dependency-version
          # change invalidates both, forcing a clean (ccache-accelerated)
          # rebuild instead of a slow from-scratch one.
          key: ${{ matrix.os }}-ccache-${{ hashFiles('engine/cmake/deps_versions.cmake') }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-ccache-${{ hashFiles('engine/cmake/deps_versions.cmake') }}-
            ${{ matrix.os }}-ccache-

      - name: Cache CMake build
        uses: actions/cache@5a3ec84eff668545934eab1c4a9ef4d8fc6e8535 # v4.2.3
        with:
          path: |
            engine/build-tests
            engine/build-release
          # Dependencies are vendored (committed under engine/third_party/),
          # so the cache only holds compiled build artifacts. deps_versions.cmake
          # is the key: bumping a pinned version invalidates both this cache and
          # ccache, forcing a clean (ccache-accelerated) rebuild.
          key: ${{ matrix.os }}-cmake-${{ hashFiles('engine/cmake/deps_versions.cmake') }}
          restore-keys: |
            ${{ matrix.os }}-cmake-

      # Dependencies are vendored under engine/third_party/ (committed, zero
      # network at configure time), so no pre-fetch / clone step is needed.

      - name: Build + test (Rust)
        shell: bash
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          cargo build --release --bin codescope
          cargo nextest run --release --no-tests=pass

      - name: Smoke test
        shell: bash
        run: |
          ./target/release/codescope --help || true
          # Verify binary is not corrupted (prints Mach-O / ELF metadata).
          file target/release/codescope

      - name: Build + test C++ engine
        shell: bash
        run: |
          # Configure with tests enabled. Dependencies are vendored under
          # engine/third_party/ (committed), so configure is fully OFFLINE and
          # sub-second. Ninja + ccache keep the compile fast.
          cmake -S engine -B engine/build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFETCHCONTENT_BASE_DIR=$PWD/engine/.deps-cache
          cmake --build engine/build-tests -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

          # Run every C++ test binary produced under the build dir.
          # nullglob: unmatched globs expand to nothing instead of a literal.
          shopt -s nullglob
          failed=0
          for test_bin in engine/build-tests/test_*; do
            # Only run regular executable files (skip dirs / non-binaries).
            [ -f "$test_bin" ] && [ -x "$test_bin" ] || continue
            test_name=$(basename "$test_bin")
            # Skip known manual/debug tools that need external args.
            case "$test_name" in
              test_bench|test_bench_enhance|test_bench_project|test_pipeline_bench|test_fast_scan_debug|test_verify_aiscope|test_bun)
                echo "  SKIP $test_name (requires external args)"
                continue
                ;;
            esac
            echo "  Running $test_name..."
            if "$test_bin" > /tmp/test_output.log 2>&1; then
              echo "  ✓ $test_name passed"
            else
              echo "  ✗ $test_name failed"
              cat /tmp/test_output.log
              failed=1
            fi
          done
          exit $failed

      - name: Strip binary
        if: inputs.skip_package != true
        shell: bash
        run: |
          strip target/release/codescope 2>/dev/null || true

      - name: Ad-hoc sign macOS binary
        if: ${{ matrix.os == 'macos-15' && inputs.skip_package != true }}
        run: codesign --sign - --force target/release/codescope 2>/dev/null || true

      - name: Package
        if: inputs.skip_package != true
        shell: bash
        run: |
          mkdir -p package
          cp target/release/codescope package/
          cp LICENSE package/
          [ -f install.sh ] && cp install.sh package/

          cd package
          tar -czf "../${{ matrix.artifact }}.tar.gz" ./*
          cd ..
          echo "Packaged: ${{ matrix.artifact }}.tar.gz ($(ls -lh ${{ matrix.artifact }}.tar.gz | awk '{print $5}'))"

      - name: Generate checksum
        if: inputs.skip_package != true
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "checksum-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@b4b15b8c7c6ac0ea25ebdfadc0e0c5f62d9ee6ee # v4.6.2
        if: inputs.skip_package != true
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt
