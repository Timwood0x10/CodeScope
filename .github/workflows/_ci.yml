# Reusable: build → test → package (macOS + Linux only)
name: CI

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true
      skip_package:
        description: 'Skip packaging (PR mode)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: codescope-x86_64-linux
          - os: ubuntu-24.04-arm
            artifact: codescope-aarch64-linux
          - os: macos-15
            artifact: codescope-aarch64-macos
          - os: windows-2022
            artifact: codescope-x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # ccache accelerates C/C++ compiles. On a dep-version cache miss
    # (full recompile of ~377 TUs) this turns a multi-minute rebuild
    # into mostly cache hits. CMakeLists already wires ccache as the
    # compiler launcher when it is on PATH.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0 # pinned to match local dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2 # v2.0.0
        with:
          tool: cargo-nextest

      - name: Install deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git gcc g++ pkg-config libssl-dev ccache patchelf
          # LadybugDB shared libraries are vendored under engine/third_party/ladybug/lib/
          # (committed to git, both x86-64 and aarch64). CMake selects the
          # correct architecture at configure time. Add the lib dir to the
          # linker path at runtime.
          ARCH_DIR=$([ "$(uname -m)" = "aarch64" ] && echo "linux-aarch64" || echo "linux")
          echo "$PWD/engine/third_party/ladybug/lib/$ARCH_DIR" | sudo tee /etc/ld.so.conf.d/ladybug.conf
          sudo ldconfig

      - name: Install deps (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install cmake ninja git ccache llvm@21
          # Export LLVM 21 as CC/CXX so both build.rs (cargo) and the
          # direct cmake call use the same compiler as local dev.
          echo "CC=/opt/homebrew/opt/llvm@21/bin/clang" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/opt/llvm@21/bin/clang++" >> $GITHUB_ENV
          # LadybugDB shared library is vendored under engine/third_party/ladybug/lib/macos/
          # (committed to git, including the liblbug.dylib dev symlink).

      - name: Install deps (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          # WinLibs portable MinGW-w64: GCC 16.1.0 + MinGW-w64 14.0.0 + UCRT +
          # SEH + POSIX threads (x86_64), pinned to match local dev toolchain.
          #
          # Why not chocolatey: the `mingw` chocolatey package version number
          # does NOT correspond to the GCC version (package 14.0.0 ships a
          # different GCC), so it cannot reliably pin GCC 16.1.0. WinLibs
          # portable builds give a deterministic, exact toolchain. Combined
          # with the static-link rustflags in .cargo/config.toml
          # ([target.x86_64-pc-windows-gnu] -static), codescope.exe becomes
          # self-contained and no longer depends on MinGW runtime DLLs, so
          # the official release and local builds can no longer clash on
          # libgcc_s_seh-1.dll / libstdc++-6.dll / libwinpthread-1.dll.
          WINLIBS_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.7z"
          curl -fsSL -o winlibs.7z "$WINLIBS_URL"
          7z x winlibs.7z -o"C:/winlibs" -y -bd
          echo "C:\winlibs\mingw64\bin" >> $GITHUB_PATH
          # Add Rust Windows GNU target (Rust version pinned to 1.95.0 by dtolnay/rust-toolchain@1.95.0)
          rustup target add x86_64-pc-windows-gnu
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
          # CMake 4.4.0 and Ninja 1.13.2 are pre-installed on GitHub Actions Windows runners
          /C/winlibs/mingw64/bin/gcc --version

      - name: Cache Cargo registry
        uses: actions/cache@v6 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Cargo.lock is committed — use it as the precise cache key
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v6 # v4.2.3
        with:
          path: target
          key: ${{ matrix.os }}-cargo-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-target-

      - name: Cache ccache
        uses: actions/cache@v6 # v4.2.3
        with:
          path: ${{ github.workspace }}/.ccache
          # Same key family as the CMake cache: a dependency-version
          # change invalidates both, forcing a clean (ccache-accelerated)
          # rebuild instead of a slow from-scratch one.
          key: ${{ matrix.os }}-ccache-${{ hashFiles('engine/cmake/deps_versions.cmake') }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-ccache-${{ hashFiles('engine/cmake/deps_versions.cmake') }}-
            ${{ matrix.os }}-ccache-

      - name: Cache CMake build
        uses: actions/cache@v6 # v4.2.3
        with:
          path: |
            engine/build-tests
            engine/build-release
          # Dependencies are vendored (committed under engine/third_party/),
          # so the cache only holds compiled build artifacts. deps_versions.cmake
          # is the key: bumping a pinned version invalidates both this cache and
          # ccache, forcing a clean (ccache-accelerated) rebuild.
          key: ${{ matrix.os }}-cmake-${{ hashFiles('engine/cmake/deps_versions.cmake') }}
          restore-keys: |
            ${{ matrix.os }}-cmake-

      # Dependencies are vendored under engine/third_party/ (committed, zero
      # network at configure time), so no pre-fetch / clone step is needed.

      - name: Build + test (Rust)
        shell: bash
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cargo build --release --target x86_64-pc-windows-gnu --bin codescope
          else
            cargo build --release --bin codescope
            cargo nextest run --release --no-tests=pass
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            ./target/x86_64-pc-windows-gnu/release/codescope.exe --help || true
            file target/x86_64-pc-windows-gnu/release/codescope.exe
          else
            ./target/release/codescope --help || true
            # Verify binary is not corrupted (prints Mach-O / ELF metadata).
            file target/release/codescope
          fi

      - name: Build + test C++ engine
        if: matrix.os != 'windows-2022'  # C++ engine is built by build.rs on Windows
        shell: bash
        run: |
          # Configure with tests enabled. Dependencies are vendored under
          # engine/third_party/ (committed), so configure is fully OFFLINE and
          # sub-second. Ninja + ccache keep the compile fast.
          # On macOS, Homebrew LLVM 21 needs the SDK sysroot for system headers.
          EXTRA_FLAGS=""
          if [ "$(uname -s)" = "Darwin" ]; then
            EXTRA_FLAGS="-DCMAKE_OSX_SYSROOT=$(xcrun --show-sdk-path)"
          fi
          cmake -S engine -B engine/build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFETCHCONTENT_BASE_DIR=$PWD/engine/.deps-cache \
            $EXTRA_FLAGS
          cmake --build engine/build-tests -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

          # Run every C++ test binary produced under the build dir.
          # nullglob: unmatched globs expand to nothing instead of a literal.
          shopt -s nullglob
          failed=0
          for test_bin in engine/build-tests/test_*; do
            # Only run regular executable files (skip dirs / non-binaries).
            [ -f "$test_bin" ] && [ -x "$test_bin" ] || continue
            test_name=$(basename "$test_bin")
            # Skip known manual/debug tools that need external args,
            # and known-failing tests tracked for future fix.
            # This list must match the Makefile's TEST_EXES skip list.
            case "$test_name" in
              test_bench|test_bench_enhance|test_bench_project|test_pipeline_bench|test_fast_scan_debug|test_verify_aiscope|test_bun)
                echo "  SKIP $test_name (requires external args)"
                continue
                ;;
              test_enhance_e2e|test_js_visitor|test_ts_visitor|test_tsx_visitor)
                echo "  SKIP $test_name (known failure, tracked for future fix)"
                continue
                ;;
              test_verify_planner|test_evidence_builder|test_project_state|test_domain_rules|test_self_bench)
                echo "  SKIP $test_name (hardcoded local paths, run manually)"
                continue
                ;;
              test_rust_e2e|test_qualified_id_ast|test_ts_e2e|test_type_extraction|test_ladybug_diff)
                echo "  SKIP $test_name (requires LadybugDB, not available on CI)"
                continue
                ;;
              test_c_e2e|test_cpp_e2e|test_e2e|test_go_e2e|test_java_e2e|test_js_e2e)
                echo "  SKIP $test_name (find_def requires LadybugDB, not available on CI)"
                continue
                ;;
              test_fp_c|test_fp_cpp|test_fp_go|test_fp_java|test_fp_js|test_fp_python|test_fp_rust|test_fp_ts)
                echo "  SKIP $test_name (known failing test, tracked for future fix)"
                continue
                ;;
              test_call_graph_method|test_call_graph_p1|test_membulk_parity|test_query_algorithms)
                echo "  SKIP $test_name (requires graph_nodes table, migrated to entity/relation)"
                continue
                ;;
              test_bench_goagent)
                echo "  SKIP $test_name (requires external goagent project)"
                continue
                ;;
            esac
            echo "  Running $test_name..."
            if "$test_bin" > /tmp/test_output.log 2>&1; then
              echo "  ✓ $test_name passed"
            else
              echo "  ✗ $test_name failed"
              cat /tmp/test_output.log
              failed=1
            fi
          done
          exit $failed

      - name: Strip binary
        if: inputs.skip_package != true
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            strip target/x86_64-pc-windows-gnu/release/codescope.exe 2>/dev/null || true
          else
            strip target/release/codescope 2>/dev/null || true
          fi

      - name: Ad-hoc sign macOS binary
        if: ${{ matrix.os == 'macos-15' && inputs.skip_package != true }}
        run: codesign --sign - --force target/release/codescope 2>/dev/null || true

      - name: Package
        if: inputs.skip_package != true
        shell: bash
        run: |
          mkdir -p package
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cp target/x86_64-pc-windows-gnu/release/codescope.exe package/
          else
            cp target/release/codescope package/
          fi
          cp LICENSE package/
          [ -f install.sh ] && cp install.sh package/

          # Bundle vendored LadybugDB shared library and set rpath so the
          # binary can find it at runtime without Homebrew/system install.
          # The binary links against @rpath/liblbug.0.dylib (macOS) or
          # liblbug.so.0 (Linux), resolved via the embedded rpath.
          case "${{ matrix.artifact }}" in
            *-x86_64-linux)
              LBUG_LIB="engine/third_party/ladybug/lib/linux/liblbug.so.0"
              LBUG_FILE="liblbug.so.0"
              ;;
            *-aarch64-linux)
              LBUG_LIB="engine/third_party/ladybug/lib/linux-aarch64/liblbug.so.0"
              LBUG_FILE="liblbug.so.0"
              ;;
            *-macos)
              LBUG_LIB="engine/third_party/ladybug/lib/macos/liblbug.0.dylib"
              LBUG_FILE="liblbug.0.dylib"
              ;;
            *-windows)
              LBUG_LIB="engine/third_party/ladybug/lib/windows/lbug_shared.dll"
              LBUG_FILE="lbug_shared.dll"
              ;;
          esac
          # Bundle LadybugDB shared lib (Linux/macOS only). Windows builds
          # without LadybugDB, so LBUG_LIB is empty there — skip the copy.
          if [ -n "$LBUG_LIB" ]; then
            cp -L "$LBUG_LIB" "package/$LBUG_FILE"
          fi
          # Set rpath to $ORIGIN (Linux) / @executable_path (macOS) so the
          # dynamic linker finds the bundled library in the same directory.
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            patchelf --set-rpath '$ORIGIN' package/codescope
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            install_name_tool -add_rpath @executable_path/. package/codescope 2>/dev/null || true
          fi

          cd package
          tar -czf "../${{ matrix.artifact }}.tar.gz" ./*
          cd ..
          echo "Packaged: ${{ matrix.artifact }}.tar.gz ($(ls -lh ${{ matrix.artifact }}.tar.gz | awk '{print $5}'))"

      - name: Generate checksum
        if: inputs.skip_package != true
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "checksum-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v7 # v4.6.2
        if: inputs.skip_package != true
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt
