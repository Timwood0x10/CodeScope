# Reusable: build → test → package (single pass, no duplication)
name: CI

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip performance tests'
        type: boolean
        default: true
      skip_package:
        description: 'Skip packaging (PR mode)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ext: .so
            artifact: codescope-x86_64-linux
          - os: macos-15
            ext: .so
            artifact: codescope-aarch64-macos
          - os: windows-2022
            ext: .dll
            artifact: codescope-x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GNU toolchain (Windows — MinGW compat)
        if: matrix.os == 'windows-2022'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git gcc g++
          # NOTE: tree-sitter and sqlite3 are compiled statically from
          # source via CMake FetchContent / amalgamation — no system
          # libraries needed. Grammar .c sources are cloned below.

      - name: Install deps (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install cmake ninja git
          # tree-sitter and sqlite3 are linked dynamically on macOS
          # (brew provides the system libraries). Grammars are compiled
          # into the binary — no node/npm needed.

      - name: Install deps (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          choco install -y cmake ninja mingw git
          # Rust is already installed via dtolnay/rust-toolchain
          # MinGW provides gcc/g++ for C++ engine compilation

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-target-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: engine/build
          key: ${{ matrix.os }}-cmake-build-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: ${{ matrix.os }}-cmake-build-

      - name: Cache grammar sources
        uses: actions/cache@v4
        with:
          path: grammars/tree-sitter-*
          key: ${{ matrix.os }}-grammars-${{ hashFiles('grammars/clone_grammars.sh') }}
          restore-keys: ${{ matrix.os }}-grammars-

      - name: Set grammar source path for CMake
        shell: bash
        run: |
          echo "TREE_SITTER_NPM=$PWD/grammars" >> "$GITHUB_ENV"
          echo "Grammar sources: $PWD/grammars"

      - name: Clone grammar sources for CMake
        shell: bash
        run: |
          cd grammars
          bash clone_grammars.sh

      - name: Build C++ engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B engine/build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              engine/
            cmake --build engine/build --target astgraph_engine
          else
            cmake -B engine/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              engine/
            cmake --build engine/build --target astgraph_engine
          fi

      - name: Build + test Rust server
        shell: bash
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
        run: |
          cargo build --release --bin codescope
          cargo nextest run --release --no-tests=pass

      - name: Strip binary
        if: inputs.skip_package != true && matrix.os != 'windows-2022'
        shell: bash
        run: |
          BIN="target/release/codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          strip "$BIN" 2>/dev/null || true

      - name: Ad-hoc sign macOS binary
        if: ${{ matrix.os == 'macos-15' && inputs.skip_package != true }}
        run: codesign --sign - --force target/release/codescope 2>/dev/null || true

      - name: Package
        if: inputs.skip_package != true
        shell: bash
        run: |
          BIN="target/release/codescope"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"

          mkdir -p package
          cp "$BIN" package/
          cp LICENSE package/
          [ -f install.sh ] && cp install.sh package/
          [ -f install.ps1 ] && cp install.ps1 package/

          cd package
          tar -czf "../${{ matrix.artifact }}.tar.gz" ./*
          cd ..
          echo "Packaged: ${{ matrix.artifact }}.tar.gz ($(ls -lh ${{ matrix.artifact }}.tar.gz | awk '{print $5}'))"

      - name: Generate checksum
        if: inputs.skip_package != true
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "checksum-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v4
        if: inputs.skip_package != true
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            checksum-${{ matrix.artifact }}.txt
