[project]
name = "codescope"
description = "CodeScope engine - C/C++ code analysis engine with Rust FFI"

[[ffi_boundary]]
from = "c"
to = "cpp"
functions = [
  "engine_init", "engine_shutdown", "engine_create_project",
  "engine_get_latest_project_id", "engine_free_string"
]
description = "Core lifecycle C -> C++ bridge"

[[ffi_boundary]]
from = "rust"
to = "c"
functions = [
  "engine_init", "engine_shutdown",
  "engine_index_file", "engine_index_project", "engine_index_batch",
  "engine_scan_project", "engine_enhance_project",
  "engine_find_definition", "engine_find_references",
  "engine_get_callers", "engine_get_callees",
  "engine_get_neighbors", "engine_find_shortest_path",
  "engine_get_subgraph", "engine_locate_node", "engine_locate_by_name",
  "engine_get_graph_stats", "engine_explore_function",
  "engine_search_code", "engine_search_semantic", "engine_build_fts",
  "engine_get_index_progress", "engine_get_complexity",
  "engine_graph_query", "engine_detect_changes",
  "engine_get_communities", "engine_get_hotspots",
  "engine_get_module_map", "engine_get_entry_points",
  "engine_trace_call_chain", "engine_get_project_overview",
  "engine_get_capabilities",
  "engine_get_module_tree", "engine_find_symbol",
  "engine_get_enhancement_status",
  "engine_unified_search", "engine_find_callers_adaptive",
  "engine_find_callees_adaptive", "engine_get_entry_points_new",
  "engine_project_overview", "engine_trace_path", "engine_build_context",
  "engine_export_artifact", "engine_import_artifact",
  "engine_get_project_info",
  "engine_free_string"
]
description = "Rust -> C++ FFI bridge functions"

[[resource_family]]
name = "c_string_alloc"
kind = "ManualHeap"
acquire = ["dupString"]
release = ["engine_free_string"]
compatible_releases = ["free"]
description = "C string malloc/ free contract"

[analysis]
cross_language = true
cross_family = true
leak_detection = true
use_after_free = true
